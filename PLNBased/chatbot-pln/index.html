<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot com PLN — Classificador de Intenções</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #8b5cf6;
      --bg: #ecfdf5;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #a7f3d0 0%, #ddd6fe 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; color: var(--text);
    }
    .app {
      width: 100%; max-width: 560px; height: min(760px, 94vh);
      background: var(--card); border-radius: 20px;
      box-shadow: 0 20px 50px rgba(30, 41, 59, 0.25);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    }
    .avatar-lg { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 24px; }
    header h1 { font-size: 17px; font-weight: 600; }
    header .status { font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.3); }
    .badge-mode { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .4px; background: rgba(255,255,255,.18); padding: 5px 10px; border-radius: 999px; }

    #chat { flex: 1; overflow-y: auto; padding: 18px 16px; background: var(--bg); display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .row { display: flex; gap: 8px; align-items: flex-end; animation: pop .25s ease-out; }
    .row.user { flex-direction: row-reverse; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .row.user .avatar { background: var(--primary); color: #fff; }
    .bubble-wrap { display: flex; flex-direction: column; max-width: 80%; }
    .row.user .bubble-wrap { align-items: flex-end; }
    .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .row.bot .bubble { background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .row.user .bubble { background: linear-gradient(135deg, var(--primary), #14b8a6); color: #fff; border-bottom-right-radius: 4px; }
    .row.error .bubble { background: #fee2e2; color: #991b1b; }

    /* Painel de análise da intenção */
    .nlp {
      margin-top: 6px; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 12px;
      padding: 8px 10px; font-size: 12px; color: #4c1d95; min-width: 220px;
    }
    .nlp .title { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 6px; }
    .intent-pill { background: var(--accent); color: #fff; padding: 1px 9px; border-radius: 999px; font-weight: 600; }
    .intent-pill.unknown { background: #ef4444; }
    .alt { display: grid; grid-template-columns: 96px 1fr 38px; align-items: center; gap: 6px; margin-top: 3px; }
    .bar { height: 6px; background: #e9e5ff; border-radius: 999px; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); border-radius: 999px; transition: width .5s ease; }
    .alt .pct { text-align: right; color: var(--muted); }
    .alt .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }

    .typing .bubble { display: flex; gap: 4px; padding: 14px 16px; }
    .typing span { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

    #suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; background: #fff; min-height: 10px; }
    .chip { border: 1px solid #99f6e4; background: #f0fdfa; color: var(--primary-dark); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: all .15s; }
    .chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-1px); }

    form { display: flex; gap: 10px; padding: 12px 16px 16px; background: #fff; }
    #message { flex: 1; border: 1px solid #cbd5e1; border-radius: 999px; padding: 12px 18px; font-size: 14.5px; outline: none; transition: border-color .15s, box-shadow .15s; }
    #message:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.18); }
    button.send { border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; width: 46px; height: 46px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: transform .15s; }
    button.send:hover { transform: scale(1.07); }
    button.send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    @media (max-width: 480px) { .app { height: 100vh; border-radius: 0; } body { padding: 0; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar-lg">🧠</div>
      <div>
        <h1>Assistente Inteligente</h1>
        <div class="status"><span class="dot"></span> Classificador Naive Bayes ativo</div>
      </div>
      <div class="badge-mode">PLN</div>
    </header>

    <div id="chat" aria-live="polite"></div>
    <div id="suggestions"></div>

    <form id="form" autocomplete="off">
      <input id="message" placeholder="Digite uma frase e veja a intenção identificada..." autofocus />
      <button class="send" id="sendBtn" type="submit" title="Enviar" aria-label="Enviar">➤</button>
    </form>
  </div>

  <script>
    // Quando aberto via http://localhost:3002 usa a mesma origem; se aberto como arquivo, aponta para o servidor.
    const API = location.protocol.startsWith("http") ? "" : "http://localhost:3002";
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const suggestionsBox = document.getElementById("suggestions");

    const now = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    const pct = (v) => Math.round(v * 100) + "%";

    // Converte **negrito** em <strong> sem usar innerHTML (evita injeção de HTML)
    function renderText(container, text) {
      text.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
        if (part.startsWith("**") && part.endsWith("**")) {
          const strong = document.createElement("strong");
          strong.textContent = part.slice(2, -2);
          container.appendChild(strong);
        } else {
          container.appendChild(document.createTextNode(part));
        }
      });
    }

    function buildNlpPanel(data) {
      const panel = document.createElement("div");
      panel.className = "nlp";

      const title = document.createElement("div");
      title.className = "title";
      const label = document.createElement("span");
      label.textContent = "Intenção:";
      const pill = document.createElement("span");
      pill.className = "intent-pill" + (data.intent === "desconhecida" ? " unknown" : "");
      pill.textContent = data.intent;
      const conf = document.createElement("span");
      conf.textContent = "(" + pct(data.confidence) + " de confiança)";
      title.append(label, pill, conf);
      panel.appendChild(title);

      (data.alternatives || []).forEach((alt) => {
        const line = document.createElement("div");
        line.className = "alt";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = alt.intent;
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.style.width = "0%";
        bar.appendChild(fill);
        const p = document.createElement("span");
        p.className = "pct";
        p.textContent = pct(alt.confidence);
        line.append(name, bar, p);
        panel.appendChild(line);
        requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = pct(alt.confidence); }));
      });
      return panel;
    }

    function addMessage(who, text, data) {
      const row = document.createElement("div");
      row.className = "row " + who;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = who === "user" ? "🙂" : "🧠";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      renderText(bubble, text);
      wrap.appendChild(bubble);

      if (data) wrap.appendChild(buildNlpPanel(data));

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = now();
      wrap.appendChild(meta);

      row.append(avatar, wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "row bot typing";
      row.innerHTML = '<div class="avatar">🧠</div><div class="bubble-wrap"><div class="bubble"><span></span><span></span><span></span></div></div>';
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function setSuggestions(list) {
      suggestionsBox.innerHTML = "";
      (list || []).forEach((s) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = s;
        chip.onclick = () => send(s);
        suggestionsBox.appendChild(chip);
      });
    }

    async function send(text) {
      const msg = (text ?? input.value).trim();
      if (!msg) return;
      input.value = "";
      setSuggestions([]);
      addMessage("user", msg);
      sendBtn.disabled = true;

      const typing = showTyping();
      try {
        const res = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        await new Promise((r) => setTimeout(r, 450));
        typing.remove();
        addMessage("bot", data.reply, data);
        setSuggestions(data.suggestions);
      } catch (err) {
        typing.remove();
        const row = addMessage("bot", "Não foi possível conectar ao servidor (porta 3002). Inicie-o com:  node server.js  na pasta PLNBased/chatbot-pln.");
        row.classList.add("error");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });

    addMessage("bot", "Olá! 👋 Eu uso **Processamento de Linguagem Natural** para entender o que você escreve.\n\nDigite qualquer frase e, junto com a resposta, mostro a **intenção identificada** e o grau de confiança do classificador.");
    setSuggestions(["Quanto custa?", "Onde está meu pedido?", "Quero cancelar minha assinatura", "Qual o horário de funcionamento?", "Preciso de ajuda"]);
  </script>
</body>
</html>
